<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The King - Painel</title>
  <style>
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(to bottom,#000,#0f0);
      color:#fff;
    }
    .centered{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
    .card{
      background:rgba(0,0,0,.85);
      padding:30px;
      border-radius:15px;
      box-shadow:0 0 10px #0f0;
      text-align:center;
      width:90%;max-width:400px;
    }
    .card img.logo{width:120px;border-radius:10px;margin-bottom:15px}
    .input{width:100%;padding:10px;margin:15px 0;border:none;border-radius:5px;background:#111;color:#fff}
    .button{background:#0f0;color:#000;border:none;padding:10px 15px;border-radius:5px;cursor:pointer;font-weight:bold;width:100%;margin-top:10px}
    .hidden{display:none}
    .switch{display:flex;align-items:center;margin:10px 0}
    .switch input{margin-right:10px}
    select,input[type=range]{width:100%;margin-top:10px}
    .tab-buttons{display:flex;justify-content:space-between;margin-bottom:15px}
    .tab-buttons button{flex:1;margin:0 5px;background:#111;color:#fff;border:2px solid #0f0;cursor:pointer}
    .fov-label{display:flex;justify-content:space-between}
    .info-box{background:#111;border:1px solid #0f0;padding:15px;border-radius:10px;margin-top:15px;display:none}
    .mensagem{background:#0f0;color:#000;padding:10px;border-radius:5px;margin-top:15px;display:none}
    .banner{width:100%;max-height:150px;object-fit:cover}
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="centered">
  <img class="banner" src="https://cdn.discordapp.com/attachments/1361113882642350205/1367636113883402291/E4BB4E9C-9818-4B64-9353-EF99CB6DD1E4.gif?ex=68154de3&is=6813fc63&hm=5cd650c8d6f1f8f06d4857498c83d48501cf2e89a6c4858c018304b417766a4b&">
  
  <div class="card">
    <img class="logo" src="https://cdn.discordapp.com/attachments/1361113882642350205/1367343084785897535/82c9e4f2-9e1c-41c2-82fc-76818513cf2f.jpg?ex=68143cfb&is=6812eb7b&hm=386f05606c9f6245a544cda05bc362e4949d48b7907cc762b84fb436ebbb08ae" alt="The King Logo">
    <h2>Login</h2>
    <input type="text" id="keyInput" class="input" placeholder="Digite sua Key">
    <button class="button" onclick="verificarKey()">Entrar</button>
    <a href="https://discord.com" target="_blank"><button class="button">Discord Oficial</button></a>
  </div>

  <img class="banner" src="https://cdn.discordapp.com/attachments/1361113882642350205/1367636113883402291/E4BB4E9C-9818-4B64-9353-EF99CB6DD1E4.gif?ex=68154de3&is=6813fc63&hm=5cd650c8d6f1f8f06d4857498c83d48501cf2e89a6c4858c018304b417766a4b&">
</div>

<!-- PAINEL -->
<div id="painel" class="hidden centered">
  <img class="banner" src="https://cdn.discordapp.com/attachments/1361113882642350205/1367636113883402291/E4BB4E9C-9818-4B64-9353-EF99CB6DD1E4.gif?ex=68154de3&is=6813fc63&hm=5cd650c8d6f1f8f06d4857498c83d48501cf2e89a6c4858c018304b417766a4b&">
  
  <div class="card">
    <h2>AUXÍLIO BY THE KING</h2>
    <div class="tab-buttons">
      <button>Aimbot</button>
      <button onclick="toggleInfo()">Info</button>
    </div>

    <div class="switch"><input type="checkbox" id="aux"><label for="aux">Ativar Auxílio</label></div>
    <div class="switch"><input type="checkbox" id="fovToggle"><label for="fovToggle">Ativar Fov</label></div>

    <div class="fov-label"><label>Fov</label><label id="fovValue">0</label></div>
    <input type="range" min="0" max="100" value="0" id="fovRange" oninput="fovValue.textContent=this.value">

    <select class="input"><option>Auxílio Head</option><option>Auxílio Corpo</option></select>

    <p>Tipo de Aimbot:</p>
    <div class="switch"><input type="radio" name="aimbot" id="atirar"><label for="atirar">Ao Atirar</label></div>
    <div class="switch"><input type="radio" name="aimbot" id="olhar"><label for="olhar">Ao Olhar</label></div>

    <button class="button" onclick="ativarFuncoes()">INJETAR FUNÇÕES NO JOGO</button>

    <div id="mensagemAtivada" class="mensagem">Opção ativada</div>
    <div id="infoBox" class="info-box">
      <p><strong>Instagram:</strong> @thekingxits</p>
      <p><strong>Desenvolvedor:</strong> @flyb001</p>
    </div>
  </div>

  <img class="banner" src="https://cdn.discordapp.com/attachments/1361113882642350205/1367636113883402291/E4BB4E9C-9818-4B64-9353-EF99CB6DD1E4.gif?ex=68154de3&is=6813fc63&hm=5cd650c8d6f1f8f06d4857498c83d48501cf2e89a6c4858c018304b417766a4b&">
</div>

<script>
function verificarKey(){
  if(document.getElementById("keyInput").value==="thekingxits"){
    login.classList.add("hidden");
    painel.classList.remove("hidden");
  }else alert("Key inválida!");
}
function toggleInfo(){
  infoBox.style.display=infoBox.style.display==="block"?"none":"block";
}
function ativarFuncoes(){
  mensagemAtivada.style.display="block";
  setTimeout(()=>mensagemAtivada.style.display="none",2000);
}
</script>
</body>
</html>
